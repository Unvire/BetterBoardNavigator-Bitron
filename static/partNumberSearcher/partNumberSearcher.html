<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wyszukiwarka kodu komponentów</title>
  <link rel="stylesheet" href="static/css/stylesPartNumberSearcher.css" />
</head>
<body>
  <div class="app">
      <div class="search">
        <input id="searchInput" type="text" placeholder="Szukaj (nazwa / kod / opis)..." />
        <button id="btnClear" class="btn">Wyczyść</button>
      </div>
    </header>
    <main class="content">
      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th>Nazwa</th>
              <th>Kod</th>
              <th>Opis</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="static/js/appPartNumberSearcher.js"></script>
</body>
</html>
