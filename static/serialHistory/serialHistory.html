<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia płytki</title>
    <link rel="stylesheet" href="./static/css/stylesSerialHistory.css">

    <script src="./static/js/mainHistoryApp.js"></script>
    <script src="./static/js/historyRequestWrapper.js"></script>
    <script src="./static/js/table.js"></script>
    <script src="./static/js/tableHeader.js"></script>
    <script src="./static/js/tableRow.js"></script>
    <script src="./static/js/historyRecordWrapper.js"></script>
</head>
<body>
    <div class="container">
        <div class="input-group">
            <input type="text" id="user-input" placeholder="Wpisz numer seryjny...">
            <button id="submit-button" data-i18n="board-history-search-button-text">Szukaj</button>
        </div>

        <div id="loader" class="hidden" data-i18n="board-history-searching-in-progress-text">Przetwarzanie danych...</div>
        
        <div id="history-table" class="table-container">
            <div id="table-header" class="table-header"></div>
            <div id="table-body"></div>
        </div>
    </div>

    <script>
        const targetOrigin = window.location.origin;

        let historyAppInstance = null;
        let translationsDict = HistoryApp.loadTranslations();

        document.addEventListener("DOMContentLoaded", () => {
            historyAppInstance = new HistoryApp();
        });


        window.addEventListener("message", (event) => {
            if (event.origin !== targetOrigin) return;

            const { type, payload } = event.data;
            switch (type) {
                case "SET_API_ROOT":
                    historyAppInstance.tracebilityRootUrl = payload;
                break;

                case "GET_DATA_REQUEST":
                    const currentMeasurementsJson = historyAppInstance.getMeasurementsJson();
                
                    window.parent.postMessage({
                        type: "DATA_RESPONSE",
                        payload: currentMeasurementsJson
                    }, targetOrigin);
                break;

                case "MOCK_HISTORY":
                    const mockHistoryJson = payload;

                    historyAppInstance.resetTableState();
                    historyAppInstance.setFilteredJsons(mockHistoryJson);
                break;

                case "CHANGE_LANGUAGE":
                    const lang = payload;
                    document.documentElement.lang = lang;

                    document.querySelectorAll('[data-i18n]').forEach(el => {
                        const key = el.getAttribute('data-i18n');
                        if (translationsDict[lang]?.[key]) {
                            el.innerText = translationsDict[lang][key];
                        }
                    });

                    const serialInput = document.getElementById('user-input');
                    serialInput.placeholder = translationsDict[lang]?.["js-serial-number-input-placeholder"] || "Wpisz numer seryjny...";
                break;
            }
        });
    </script>
</body>
</html>
